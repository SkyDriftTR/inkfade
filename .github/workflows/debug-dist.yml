name: Debug dist (geçici)
on:
  push:
    branches: [debug-build]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
      - run: node .github/maptest/fetch.mjs dist/_maptest
      - run: |
          cd dist
          git init -q -b debug-dist
          git config user.name ci; git config user.email ci@example.com
          git add -A; git commit -qm dist
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" debug-dist
