name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm install
      - run: npm run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Bing ve IndexNow destekleyen diğer arama motorlarına "sayfalar güncellendi" diye haber verir.
  # Anahtar dosyası: public/e91c74a8e5790533cc7c64be2d671efd.txt. Sadece özel domainde çalışır; hata verirse yayını etkilemez.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Site haritasındaki adresleri IndexNow'a gönder
        env:
          KEY: e91c74a8e5790533cc7c64be2d671efd
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SITE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/${{ github.repository }}/pages | jq -r '.cname // empty')
          if [ -z "$SITE" ]; then echo "Özel domain yok, atlanıyor."; exit 0; fi
          sleep 30  # yeni sürümün yayına oturmasını bekle
          URLS=$(curl -s "https://$SITE/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's#</loc>##' | jq -R . | jq -s -c .)
          echo "Gönderilen adresler: $URLS"
          curl -s -o /dev/null -w "IndexNow yanıtı: %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"$SITE\",\"key\":\"$KEY\",\"keyLocation\":\"https://$SITE/$KEY.txt\",\"urlList\":$URLS}"
